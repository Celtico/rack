# Publishes RACK to GitHub Pages on every push to main. Everything runs in the browser, so the
# site is just the contents of dist/, built for wherever Pages serves it: /<repository>/ on
# github.io, or the root when the repository has a custom domain (Settings → Pages).
#
# One-time setup in the repository: Settings → Pages → Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The version by the toolbar mark is the commit count, so the build needs the history.
          fetch-depth: 0
      # Where the site is served: "/rack" on celtico.github.io, empty with a custom domain.
      - id: pages
        uses: actions/configure-pages@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
