<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1372 1382">
  <!-- RACK: the user's logo (Desktop/logo.svg) — three black tiles and a diamond on white. Rounded here;
       the full-bleed icons use the same art on the square (rx stripped), and the maskable one shrinks the
       art (the `art` group) into Android's safe circle. -->
  <defs>
    <clipPath id="tile"><rect width="1372" height="1382" rx="300"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1372" height="1382" fill="#fff"/>
    <g id="art">
      <rect x="748.042" y="254.776" width="361" height="361" rx="2" fill="#000"/>
      <rect x="958.578" y="722.95" width="361.28" height="361.28" rx="2" transform="rotate(45 958.578 722.95)" fill="#000"/>
      <rect x="254.042" y="254.776" width="363" height="361" rx="2" fill="#000"/>
      <rect x="254.042" y="757.776" width="363" height="361" rx="2" fill="#000"/>
    </g>
  </g>
</svg>
